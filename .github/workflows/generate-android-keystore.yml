name: Generate Android signing keystore (run once)

# Manual, one-time use: creates the release signing key for ai.amgstores.app.
# Do NOT run this again after the app's first Play Store upload — the signing
# key must stay the same for every future release, or Play Store will reject
# updates. Re-running this creates a *different* key and will orphan any
# build already signed with the old one.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type GENERATE to confirm — this creates a NEW signing key. Only run this once, ever.'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm intent
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "GENERATE" ]; then
            echo "Confirmation text did not match 'GENERATE' — aborting." >&2
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Generate keystore + random password
        run: |
          set -euo pipefail
          # PKCS12 keystores store/key passwords must match — some JDK/Android
          # tooling combinations fail to decrypt the key ("Given final block
          # not properly padded") when they differ, even though `keytool`
          # itself accepts different values at creation time without error.
          PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | cut -c1-24)

          keytool -genkeypair -v \
            -keystore release.jks \
            -alias amg-com \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storetype PKCS12 \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -dname "CN=AMG.COM, OU=AMG, O=Topmindmobi, L=Nairobi, ST=Nairobi, C=KE"

          FINGERPRINT=$(keytool -list -v -keystore release.jks -alias amg-com -storepass "$PASS" \
            | grep 'SHA256:' | head -1 | sed 's/.*SHA256: //')

          base64 -w0 release.jks > keystore-base64.txt

          {
            echo "=== 1. Add these as GitHub repo secrets ==="
            echo "    Settings -> Secrets and variables -> Actions -> New repository secret"
            echo ""
            echo "ANDROID_KEYSTORE_BASE64   -> paste the contents of keystore-base64.txt"
            echo "ANDROID_KEYSTORE_PASSWORD -> $PASS"
            echo "ANDROID_KEY_ALIAS         -> amg-com"
            echo "ANDROID_KEY_PASSWORD      -> $PASS"
            echo ""
            echo "=== 2. SHA256 certificate fingerprint ==="
            echo "    Paste this into BOTH files, replacing PLACEHOLDER_SHA256_FINGERPRINT:"
            echo "    - public/.well-known/assetlinks.json"
            echo "    - android/app/src/main/res/values/strings.xml"
            echo ""
            echo "$FINGERPRINT"
            echo ""
            echo "=== 3. After adding the secrets ==="
            echo "    Delete this workflow run (and the artifact) once you've copied"
            echo "    everything out — it contains your signing key and passwords."
          } > keystore-info.txt

      - uses: actions/upload-artifact@v4
        with:
          name: amg-com-release-keystore-DELETE-AFTER-USE
          path: |
            keystore-info.txt
            keystore-base64.txt
            release.jks
          retention-days: 1
