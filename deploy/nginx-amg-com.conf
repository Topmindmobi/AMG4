# Host nginx → AMG Stores Docker (port 8090). Certbot will add SSL blocks.
# server_name: amgstores.ai www.amgstores.ai

server {
    listen 80;
    listen [::]:80;
    server_name amgstores.ai www.amgstores.ai;

    client_max_body_size 50m;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
        # Supabase OAuth sessions return multiple large Set-Cookie headers
        # (access + refresh token) that overflow nginx's default header
        # buffer, aborting the response with 502 "upstream sent too big
        # header" before it ever reaches the app.
        proxy_buffer_size 16k;
        proxy_buffers 4 16k;
        proxy_busy_buffers_size 32k;
    }
}
